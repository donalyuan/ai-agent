services:
  ai-agent-db-init:
    image: postgres:16-alpine
    container_name: ai-agent-db-init
    restart: "no"
    environment:
      PGPASSWORD: postgres
    command:
      - sh
      - -lc
      - |
        if psql -h biga-postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'video_agent'" | grep -q 1; then
          echo "database video_agent already exists"
        else
          psql -h biga-postgres -U postgres -d postgres -c "CREATE DATABASE video_agent"
        fi
    depends_on:
      - biga-postgres

  ai-agent-api:
    build:
      context: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/backend
      dockerfile: Dockerfile
    container_name: ai-agent-api
    working_dir: /app
    command: cargo run -p novex-api --bin novex-api
    env_file:
      - path: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/.env
        required: false
    ports:
      - "18180:8080"
    volumes:
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}:/app
      - ai-agent-generated-assets:/app/storage/assets
    environment:
      AI_AGENT_ENV: development
      DATABASE_URL: postgres://postgres:postgres@biga-postgres:5432/video_agent
      REDIS_URL: redis://bs-redis:6379/2
      ASSET_STORAGE_ROOT: /app/storage/assets
    depends_on:
      ai-agent-db-init:
        condition: service_completed_successfully
      bs-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ai-agent-video-worker:
    build:
      context: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/services/video-worker
      dockerfile: Dockerfile
    container_name: ai-agent-video-worker
    working_dir: /app
    command: uvicorn video_worker.main:app --host 0.0.0.0 --port 8081 --reload
    env_file:
      - path: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/.env
        required: false
    ports:
      - "18181:8081"
    volumes:
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/services/video-worker:/app
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/backend/migrations:/app/backend-migrations:ro
      - ai-agent-generated-assets:/app/storage/assets
    environment:
      AI_AGENT_ENV: development
      DATABASE_URL: postgres://postgres:postgres@biga-postgres:5432/video_agent
      REDIS_URL: redis://bs-redis:6379/2
      ASSET_GENERATION_WORKER_ENABLED: "${ASSET_GENERATION_WORKER_ENABLED:-false}"
      VOICE_CATALOG_WORKER_ENABLED: "${VOICE_CATALOG_WORKER_ENABLED:-false}"
      SPEECH_GENERATION_WORKER_ENABLED: "${SPEECH_GENERATION_WORKER_ENABLED:-false}"
      TOS_TOOL_WORKER_ENABLED: "${TOS_TOOL_WORKER_ENABLED:-false}"
      WORK_GENERATION_WORKER_ENABLED: "${WORK_GENERATION_WORKER_ENABLED:-false}"
      WORK_GENERATION_FAKE_PROVIDER_ENABLED: "${WORK_GENERATION_FAKE_PROVIDER_ENABLED:-false}"
      WORK_GENERATION_REAL_PROVIDER_ENABLED: "${WORK_GENERATION_REAL_PROVIDER_ENABLED:-false}"
      WORK_GENERATION_REAL_RUN_ALLOWLIST: "${WORK_GENERATION_REAL_RUN_ALLOWLIST:-}"
      WORK_GENERATION_REAL_MAX_VIDEO_TASKS: "${WORK_GENERATION_REAL_MAX_VIDEO_TASKS:-1}"
      WORK_GENERATION_REAL_MAX_VIDEO_SECONDS: "${WORK_GENERATION_REAL_MAX_VIDEO_SECONDS:-15}"
      WORK_GENERATION_REAL_MAX_TTS_CHARACTERS: "${WORK_GENERATION_REAL_MAX_TTS_CHARACTERS:-398}"
      WORK_GENERATION_REAL_MAX_ASR_TASKS: "${WORK_GENERATION_REAL_MAX_ASR_TASKS:-0}"
      WORK_GENERATION_REAL_MAX_CONCURRENCY: "${WORK_GENERATION_REAL_MAX_CONCURRENCY:-1}"
      WORK_GENERATION_REAL_SUBMIT_RETRIES: "${WORK_GENERATION_REAL_SUBMIT_RETRIES:-0}"
      WORK_GENERATION_POLL_SECONDS: "${WORK_GENERATION_POLL_SECONDS:-5}"
      VOICE_CATALOG_POLL_SECONDS: "${VOICE_CATALOG_POLL_SECONDS:-5}"
      SPEECH_GENERATION_POLL_SECONDS: "${SPEECH_GENERATION_POLL_SECONDS:-5}"
      SPEECH_WORKER_LEASE_SECONDS: "${SPEECH_WORKER_LEASE_SECONDS:-600}"
      ASSET_STORAGE_ROOT: /app/storage/assets
      ASSET_PUBLIC_PREFIX: /assets
    depends_on:
      ai-agent-db-init:
        condition: service_completed_successfully
      bs-redis:
        condition: service_started

  ai-agent-admin:
    build:
      context: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/admin
      dockerfile: Dockerfile
    container_name: ai-agent-admin
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    ports:
      - "18182:3000"
    volumes:
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/admin:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18180
      NEXT_PUBLIC_WORKER_BASE_URL: http://localhost:18181
    depends_on:
      ai-agent-api:
        condition: service_healthy

  ai-agent-video-agent:
    build:
      context: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/apps/video-agent
      dockerfile: Dockerfile
    container_name: ai-agent-video-agent
    working_dir: /app
    command: sh -lc "npm install && npm run dev"
    ports:
      - "18183:3000"
    volumes:
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/apps/video-agent:/app
    environment:
      NEXT_PUBLIC_WORKER_BASE_URL: http://localhost:18181
    depends_on:
      ai-agent-api:
        condition: service_healthy

  ai-agent-agent-runtime:
    build:
      context: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/services/agent-runtime
      dockerfile: Dockerfile
    container_name: ai-agent-agent-runtime
    env_file:
      - path: ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}/.env
        required: false
    ports:
      - "18184:8082"
    volumes:
      - ai-agent-session-data:/data
      - ${VIDEO_AGENT_WORKSPACE_ROOT:-/server/ai-agent}:/workspace
    environment:
      DATABASE_URL: postgres://postgres:postgres@biga-postgres:5432/video_agent
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: 8082
      AGENT_RUNTIME_SQLITE_PATH: /data/agent-sessions.sqlite
      AGENT_RUNTIME_WORKSPACE_ROOT: /workspace
      AGENT_RUNTIME_SHUTDOWN_TIMEOUT_MS: 10000
    depends_on:
      ai-agent-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  ai-agent-generated-assets:
  ai-agent-session-data:

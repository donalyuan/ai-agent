[package]
name = "novex-production-crew"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# AI 基础设施（PromptCompiler、DefinitionRegistry、ContextCandidate）
novex-ai-core = { path = "../novex-ai-core" }
# 带审计的模型执行器（AuditedModelExecutor、FixedModelBinding）
novex-agent = { path = "../novex-agent" }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

# UUID 和时间
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 日志
tracing = "0.1"

# JSON Schema 验证
jsonschema = { version = "0.17", features = ["draft202012"] }

[dev-dependencies]
tokio-test = "0.4"

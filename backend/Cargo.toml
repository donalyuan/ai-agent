[package]
name = "novex-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "novex_api"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mime_guess = "2"
novex-model = { path = "../crates/novex-model" }
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
validator = { version = "0.20", features = ["derive"] }
zip = { version = "2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

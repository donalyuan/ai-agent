services:
  postgres:
    image: postgres:18.1-alpine3.21
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase0 -d phase0"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_DB: temporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $$(hostname -i):7233 cluster health"]
      interval: 5s
      timeout: 5s
      retries: 24

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: postgresql+psycopg://phase0:phase0@postgres:5432/phase0
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
      PROVIDER_MODE: ${PROVIDER_MODE}
      STORAGE_MODE: ${STORAGE_MODE}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
      PROVIDER_PROFILE_ID: ${PROVIDER_PROFILE_ID}
      PROVIDER_MODEL_ID: ${PROVIDER_MODEL_ID}
      PROVIDER_CREDENTIAL_REF: ${PROVIDER_CREDENTIAL_REF}
      STORAGE_PROFILE_ID: ${STORAGE_PROFILE_ID}
      STORAGE_BUCKET_BINDING_ID: ${STORAGE_BUCKET_BINDING_ID}
      STORAGE_CREDENTIAL_REF: ${STORAGE_CREDENTIAL_REF}
      RENDERER_PROFILE_ID: ${RENDERER_PROFILE_ID}
      EXPECTED_MIGRATION_HEAD: ${EXPECTED_MIGRATION_HEAD}
      FFMPEG_PATH: ${FFMPEG_PATH}
      FFPROBE_PATH: ${FFPROBE_PATH}
      RENDERER_REQUIRED: ${RENDERER_REQUIRED}
    volumes:
      - local-workspace:${WORKSPACE_ROOT}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: ["python", "workers/agent/main.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
      PROVIDER_MODE: ${PROVIDER_MODE}
      STORAGE_MODE: ${STORAGE_MODE}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
      AGENT_TASK_QUEUE: agent-tasks
      WORKER_HEALTH_MARKER: /tmp/agent-health.json
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "workers/agent/main.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 24

  generation:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: ["python", "workers/generation/main.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
      PROVIDER_MODE: ${PROVIDER_MODE}
      STORAGE_MODE: ${STORAGE_MODE}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
      PROVIDER_PROFILE_ID: ${PROVIDER_PROFILE_ID}
      PROVIDER_MODEL_ID: ${PROVIDER_MODEL_ID}
      PROVIDER_CREDENTIAL_REF: ${PROVIDER_CREDENTIAL_REF}
      STORAGE_PROFILE_ID: ${STORAGE_PROFILE_ID}
      STORAGE_BUCKET_BINDING_ID: ${STORAGE_BUCKET_BINDING_ID}
      STORAGE_CREDENTIAL_REF: ${STORAGE_CREDENTIAL_REF}
      EXPECTED_MIGRATION_HEAD: ${EXPECTED_MIGRATION_HEAD}
      GENERATION_TASK_QUEUE: generation-tasks
      WORKER_HEALTH_MARKER: /tmp/generation-health.json
    volumes:
      - local-workspace:${WORKSPACE_ROOT}
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "workers/generation/main.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 24

  media:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: ["python", "workers/media/main.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS}
      PROVIDER_MODE: ${PROVIDER_MODE}
      STORAGE_MODE: ${STORAGE_MODE}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT}
      PROVIDER_PROFILE_ID: ${PROVIDER_PROFILE_ID}
      PROVIDER_MODEL_ID: ${PROVIDER_MODEL_ID}
      PROVIDER_CREDENTIAL_REF: ${PROVIDER_CREDENTIAL_REF}
      STORAGE_PROFILE_ID: ${STORAGE_PROFILE_ID}
      STORAGE_BUCKET_BINDING_ID: ${STORAGE_BUCKET_BINDING_ID}
      STORAGE_CREDENTIAL_REF: ${STORAGE_CREDENTIAL_REF}
      RENDERER_PROFILE_ID: ${RENDERER_PROFILE_ID}
      EXPECTED_MIGRATION_HEAD: ${EXPECTED_MIGRATION_HEAD}
      FFMPEG_PATH: ${FFMPEG_PATH}
      FFPROBE_PATH: ${FFPROBE_PATH}
      RENDERER_REQUIRED: ${RENDERER_REQUIRED}
      MEDIA_TASK_QUEUE: media-tasks
      WORKER_HEALTH_MARKER: /tmp/media-health.json
    volumes:
      - local-workspace:${WORKSPACE_ROOT}
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "workers/media/main.py", "--health"]
      interval: 5s
      timeout: 3s
      retries: 24

  migrate:
    profiles: ["migration"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    working_dir: /workspace/services/api
    command: ["alembic", "-c", "/workspace/services/api/alembic.ini", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    profiles: ["diagnostics"]
    image: otel/opentelemetry-collector:0.134.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD", "/otelcol", "components"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  local-workspace:
